<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>投喂页 | Sakimu</title>
    <meta
      name="description"
      content="Sakimu 的投喂页，用于展示赞助方式、支持说明和捐助入口。"
    />
    <meta name="author" content="Sakimu" />
    <meta name="theme-color" content="#f7f7f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#171412" media="(prefers-color-scheme: dark)" />

    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <meta property="og:site_name" content="Sakimu" />
    <meta property="og:title" content="Sakimu 投喂页" />
    <meta
      property="og:description"
      content="支持作者继续创作与维护工具的捐助页面。"
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://sakimu.com/donate/" />
    <meta property="og:image" content="https://sakimu.com/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Sakimu 投喂页封面图" />
    <meta property="og:locale" content="zh_CN" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Sakimu 投喂页" />
    <meta name="twitter:description" content="支持作者继续创作与维护工具的捐助页面。" />
    <meta name="twitter:image" content="https://sakimu.com/og-image.jpg" />

    <link rel="canonical" href="https://sakimu.com/donate/" />
    <link rel="stylesheet" href="/styles.css" />
    <script src="/app.js" defer></script>
    <link
      rel="preload"
      as="image"
      type="image/webp"
      imagesrcset="./zhifubao-donate-560.webp 560w, ./zhifubao-donate.webp 820w"
      imagesizes="(max-width: 640px) 220px, 262px"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "BreadcrumbList",
            "@id": "https://sakimu.com/donate/#breadcrumb",
            "itemListElement": [
              { "@type": "ListItem", "position": 1, "name": "首页", "item": "https://sakimu.com/" },
              { "@type": "ListItem", "position": 2, "name": "投喂", "item": "https://sakimu.com/donate/" }
            ]
          },
          {
            "@type": "WebPage",
            "@id": "https://sakimu.com/donate/#webpage",
            "url": "https://sakimu.com/donate/",
            "name": "投喂页 | Sakimu",
            "description": "支持作者继续创作与维护工具的捐助页面。",
            "isPartOf": { "@id": "https://sakimu.com/#website" },
            "breadcrumb": { "@id": "https://sakimu.com/donate/#breadcrumb" },
            "inLanguage": "zh-CN"
          }
        ]
      }
    </script>
  </head>
  <body data-page="donate">
    <div class="page-shell">
      <div class="site-header-bar">
        <header class="site-header container">
          <a class="brand" href="/">
            <img class="brand__mark" src="/icon-mark-64.webp" alt="" width="64" height="64" decoding="async" />
            <span>Sakimu</span>
          </a>
          <nav class="site-nav" aria-label="站点导航">
            <a href="/">首页</a>
            <a href="https://blog.sakimu.com" target="_blank" rel="noopener">博客</a>
            <a href="/tools/">工具</a>
            <a href="/donate/" class="is-active" aria-current="page">投喂</a>
          </nav>
        </header>
      </div>

      <main class="container page-main donate-main">
        <section class="donate-intro">
          <span class="eyebrow">投喂</span>
          <h1>支付宝投喂</h1>
          <p>
            如果这个小站刚好帮到你，欢迎轻轻投喂一下，让它继续慢慢长大喵～
          </p>
        </section>

        <section class="panel donate-card" id="alipay">
          <div class="donate-card__copy">
            <span class="donate-card__tag">请奶茶计划</span>
            <p class="donate-card__lead">每一点点支持，都会变成继续更新这个站的动力。</p>
            <h2>扫一下就好啦</h2>
            <p>
              用支付宝扫一扫右侧收款码，就可以请小站长喝一杯奶茶喵～
            </p>
            <p class="donate-card__thanks">谢谢你的喜欢，这份心意会被认真收下。</p>
          </div>
          <figure class="donate-card__media">
            <div class="donate-card__poster">
              <span class="donate-card__stamp">ALIPAY</span>
              <picture>
                <source
                  type="image/webp"
                  srcset="./zhifubao-donate-560.webp 560w, ./zhifubao-donate.webp 820w"
                  sizes="(max-width: 640px) 220px, 262px"
                />
                <img
                  src="./zhifubao-donate-560.jpg"
                  srcset="./zhifubao-donate-560.jpg 560w, ./zhifubao-donate.jpg 820w"
                  sizes="(max-width: 640px) 220px, 262px"
                  alt="支付宝收款码"
                  class="donate-card__image"
                  width="820"
                  height="1229"
                  decoding="async"
                  fetchpriority="high"
                />
              </picture>
            </div>
            <figcaption class="donate-card__caption">支付宝扫码即可</figcaption>
          </figure>
        </section>
      </main>

      <footer class="site-footer container">
        <p class="site-footer__meta">
          <span>© <span data-year>2026</span> Sakimu.</span>
          <span class="site-footer__dot" aria-hidden="true"></span>
          <a
            href="https://beian.miit.gov.cn/"
            target="_blank"
            rel="noreferrer noopener"
          >皖ICP备2020020404号-5</a>
        </p>
      </footer>
    </div>
  </body>
</html>
